name: C/C++ CI

on:
  push:
    branches: [ libjitsi_v2 ]
  pull_request:
    branches: [ libjitsi_v2 ]

permissions:
  contents: read

jobs:
  build-cmake:
    name: CMake build on ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - name: checkout
      uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2
    - name: cmake
      run: cmake .
    - name: build
      run: cmake --build .
